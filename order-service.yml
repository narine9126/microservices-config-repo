server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/order_db?useSSL=false&serverTimezone=UTC
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

resilience4j:
  circuitbreaker:
    instances:
      productService:
        # The circuit breaker monitors most recent 5 calls to the method. If the last 5 calls have 2 failures and 3 success the failure rate is 40%.
        sliding-window-size: 5
        # The circute breaker expects minimum 5 calls to be recorded, before it calculate failure rate and decides whether to open circuit.
        minimumNumberOfCalls: 5
        # If the failure rate reaches or exceeds 50% then circuit breaker state transition to OPEN (calls not allowed in this state), indicates minimum number of calls have been reached.
        # formula: failureRate = (Failed Calls/Total Recorded Calls) * 100
        failure-rate-threshold: 50
        # Once circuit breaker enters into OPEN state, It will wait 10 seconds before normally transitioning into HALF-OPEN.
        # During OPEN state, calls to this method rejected, and fallbackmethod can handle these rejected calls.
        wait-duration-in-open-state: 10s
  retry:
    instances:
      productService:
        # Maximum of 4 total attempts: 1 initial call + 3 retries.
        maxAttempts: 4
        # Initial delay between retry attempts.
        waitDuration: 2s
        # Enables increasing retry delays.
        enableExponentialBackoff: true
        # Doubles the delay after each failed attempt.(2nd attempt after two sec, 3rd attempt after four sec, 4th attempt after 8 seconds)
        # meaning, exponential backoff, the retry delays are approximately 2 seconds, 4 seconds, and 8 seconds
        exponentialBackoffMultiplier: 2
        # Retry only the specified exception types.
        retryExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
